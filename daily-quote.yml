name: Daily Philosophy Quote

on:
  schedule:
    # UTC 20:30 = 한국시간(KST) 05:30
    # 참고: GitHub Actions 무료 요금제의 cron은 부하에 따라 몇 분~십몇 분 늦게 실행될 수 있음
    - cron: "30 20 * * *"
  workflow_dispatch: {}  # Actions 탭에서 수동 실행 테스트용

permissions:
  contents: write

jobs:
  send-quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 명언 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_quote.py

      - name: 보낸 목록(sent.json) 저장소에 반영
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sent.json
          git diff --staged --quiet || git commit -m "chore: update sent quote log"
          git push
